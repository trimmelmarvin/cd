version: "3.8"

services:
  webapp:
    build:
      context: https://github.com/DEIN-GITHUB-USER/DEIN-REPO.git
      dockerfile: Dockerfile
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"          # im LAN erreichbar unter http://<server-ip>:8080
    networks:
      - dashboard_net

networks:
  dashboard_net:
    driver: bridge
