<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fahrzeug-Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Fahrzeug-Dashboard</h1>
        <p>
            <span id="connState" class="conn">verbinde…</span>
            &middot; <a href="/docs">API-Doku</a>
        </p>
    </header>

    <main>
        <section class="gauges">
            <div class="gauge"
                 data-gauge="rpm"
                 data-label="Drehzahl"
                 data-unit="1/min"
                 data-max="{{ rpm_max }}"
                 data-redline="{{ rpm_redline }}"
                 data-major-step="1000"
                 data-label-step="1000"
                 data-label-divisor="1000"></div>

            <div class="gauge"
                 data-gauge="speed_kmh"
                 data-label="Geschwindigkeit"
                 data-unit="km/h"
                 data-max="{{ speed_max }}"
                 data-major-step="20"
                 data-label-step="40"
                 data-label-divisor="1"></div>
        </section>

        <section class="pedals">
            <div class="pedal" data-pedal="throttle">
                <span class="lamp"></span>
                <span class="pedal-name">Gas</span>
                <span class="pedal-state">nein</span>
            </div>
            <div class="pedal" data-pedal="brake">
                <span class="lamp"></span>
                <span class="pedal-name">Bremse</span>
                <span class="pedal-state">nein</span>
            </div>
            <div class="pedal" data-pedal="clutch">
                <span class="lamp"></span>
                <span class="pedal-name">Kupplung</span>
                <span class="pedal-state">nein</span>
            </div>
        </section>

        <section class="controls">
            <label>
                <input type="checkbox" id="demoToggle" checked>
                Demo-Modus (simulierte Fahrt)
            </label>
        </section>
    </main>

    <script src="/static/dashboard.js"></script>
</body>
</html>
